name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle izinlerini ayarla
        run: chmod +x ./gradlew

      - name: Gradle versiyonunu göster
        run: ./gradlew --version

      - name: Debug APK oluştur
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Keystore oluştur
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ota-release.jks"

          test -s "$RUNNER_TEMP/ota-release.jks"

          echo "Keystore hazır."

      - name: APK'yı imzala
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          test -n "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/ota-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/OTA-Deneyi-signed.apk" \
            "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk

      - name: APK imzasını doğrula
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/OTA-Deneyi-signed.apk"

      - name: SHA-256 oluştur
        run: |
          sha256sum \
            "$GITHUB_WORKSPACE/OTA-Deneyi-signed.apk" \
            > "$GITHUB_WORKSPACE/OTA-Deneyi-signed.apk.sha256"

          cat "$GITHUB_WORKSPACE/OTA-Deneyi-signed.apk.sha256"

      - name: İmzalı APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ota-deneyi-signed-apk
          path: |
            OTA-Deneyi-signed.apk
            OTA-Deneyi-signed.apk.sha256
          if-no-files-found: error

      - name: Keystore'u temizle
        if: always()
        run: rm -f "$RUNNER_TEMP/ota-release.jks"
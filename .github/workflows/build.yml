name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: gradlew izinlerini ayarla
        run: chmod +x ./gradlew

      - name: wrapper properties dosyasini goster
        run: cat gradle/wrapper/gradle-wrapper.properties

      - name: Gradle versiyonunu goster
        run: ./gradlew --version

      - name: assembleDebug calistir
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: APK artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: ota-deneyi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

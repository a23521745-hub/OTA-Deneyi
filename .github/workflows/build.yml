name: Build, Sign and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle izinlerini ayarla
        run: chmod +x ./gradlew

      - name: Debug APK oluştur
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Private key'i dosyaya kaydet
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem

      - name: APK'yı SHA256 ile imzala
        run: |
          openssl dgst -sha256 -sign private_key.pem \
            -out signature.sig \
            app/build/outputs/apk/debug/app-debug.apk
          
          base64 -w0 signature.sig > signature.b64
          
          cat signature.b64

      - name: İmzalı APK'yı yeniden adlandır
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OTA-Deneyi-v6.apk
          cp signature.b64 OTA-Deneyi-v6.sig

      - name: Release oluştur ve APK'yı yükle
        uses: softprops/action-gh-release@v1
        with:
          tag_name: OTA-Deneyi-Realses
          files: |
            OTA-Deneyi-v6.apk
            OTA-Deneyi-v6.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Private key'i temizle
        if: always()
        run: rm -f private_key.pem signature.sig signature.b64

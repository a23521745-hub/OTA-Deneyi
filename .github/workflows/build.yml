name: Build, Sign and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: OTA-Deneyi.apk
  RELEASE_TAG: OTA-Deneyi-Realses

jobs:
  build-sign-release:
    name: Build, Sign & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: versionCode'u oku ve artır
        id: version
        run: |
          CURRENT=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          NEXT=$((CURRENT + 1))
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: versionCode'u güncelle
        run: |
          sed -i "s/versionCode ${{ steps.version.outputs.current }}/versionCode ${{ steps.version.outputs.next }}/" app/build.gradle
          grep "versionCode" app/build.gradle

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle izinlerini ayarla
        run: chmod +x ./gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: APK Hazırla ve RSA İmzası Üret
        env:
          PRIVATE_KEY: ${{ secrets._PRIVATEKEY_ }}
        run: |
          set -euo pipefail

          SRC_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          test -f "$SRC_APK"
          cp "$SRC_APK" "$APK_NAME"

          # Private key'i temp dosyaya yaz
          KEY_FILE="$RUNNER_TEMP/private_key.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          # RSA-4096 ile imzala
          openssl dgst -sha256 -sign "$KEY_FILE" -out signature.sig "$APK_NAME"
          base64 -w0 signature.sig > signature.b64
          rm -f signature.sig

      - name: update.json oluştur
        run: |
          SIGNATURE=$(cat signature.b64)
          cat > update.json << 'JSONEOF'
          {
            "versionCode": ${{ steps.version.outputs.next }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.APK_NAME }}",
            "signature": "$SIGNATURE",
            "changelog": "Otomatik build - versiyon ${{ steps.version.outputs.next }}"
          }
          JSONEOF
          cat update.json

      - name: Release oluştur/güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "OTA-Deneyi v${{ steps.version.outputs.next }}"
          make_latest: true
          files: |
            ${{ env.APK_NAME }}
            signature.b64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: versionCode değişikliklerini commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle update.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: versionCode ${{ steps.version.outputs.next }}'e yükseltildi"
          git push

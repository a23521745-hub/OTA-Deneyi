name: Build, Sign and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle izinlerini ayarla
        run: chmod +x ./gradlew

      - name: Debug APK oluştur
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Private key'i kaydet
        run: |
          cat > /tmp/private_key.pem << 'KEYEOF'
          ${{ secrets._PRIVATEKEY_ }}
          KEYEOF

      - name: APK'yı imzala
        run: |
          openssl dgst -sha256 -sign /tmp/private_key.pem \
            -out /tmp/signature.sig \
            app/build/outputs/apk/debug/app-debug.apk
          
          base64 -w0 /tmp/signature.sig > signature.b64
          cp app/build/outputs/apk/debug/app-debug.apk OTA-Deneyi-v6.apk

      - name: Release sil ve yenisini oluştur
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Eski release'i bul
            const releases = await github.rest.repos.listReleases({owner, repo});
            const oldRelease = releases.data.find(r => r.tag_name === 'OTA-Deneyi-Realses');
            
            if (oldRelease) {
              await github.rest.repos.deleteRelease({owner, repo, release_id: oldRelease.id});
            }
            
            // Yeni release oluştur
            const newRelease = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: 'OTA-Deneyi-Realses',
              name: 'OTA-Deneyi-v6',
              body: 'Automatic release'
            });
            
            // Dosyaları yükle
            const apkData = fs.readFileSync('OTA-Deneyi-v6.apk');
            const sigData = fs.readFileSync('signature.b64');
            
            await github.rest.repos.uploadReleaseAsset({
              owner, repo,
              release_id: newRelease.id,
              name: 'OTA-Deneyi-v6.apk',
              data: apkData
            });
            
            await github.rest.repos.uploadReleaseAsset({
              owner, repo,
              release_id: newRelease.id,
              name: 'signature.b64',
              data: sigData
            });

      - name: Temizle
        if: always()
        run: rm -f /tmp/private_key.pem /tmp/signature.sig

name: Build and Sign APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: gradlew izinlerini ayarla
        run: chmod +x ./gradlew

      - name: Wrapper properties dosyasını göster
        run: cat gradle/wrapper/gradle-wrapper.properties

      - name: Gradle versiyonunu göster
        run: ./gradlew --version

      - name: Android SDK build-tools kontrolü
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Release keystore'u oluştur
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "HATA: KEYSTORE_BASE64 secret tanımlı değil."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ota-release.jks"

          if [ ! -s "$RUNNER_TEMP/ota-release.jks" ]; then
            echo "HATA: Keystore oluşturulamadı."
            exit 1
          fi

          echo "Keystore başarıyla hazırlandı."

      - name: assembleDebug çalıştır
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Oluşan APK'yı bul
        id: apk
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "HATA: Debug APK bulunamadı."
            exit 1
          fi

          echo "APK bulundu: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: En güncel apksigner'ı bul
        id: apksigner
        run: |
          set -euo pipefail

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "HATA: apksigner bulunamadı."
            exit 1
          fi

          chmod +x "$APKSIGNER"

          echo "apksigner: $APKSIGNER"
          echo "path=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: APK'yı Android keystore ile imzala
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          "$APKSIGNER_PATH" sign \
            --ks "$RUNNER_TEMP/ota-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out app/build/outputs/apk/debug/OTA-Deneyi-signed.apk \
            "${{ steps.apk.outputs.path }}"

        env:
          APKSIGNER_PATH: ${{ steps.apksigner.outputs.path }}

      - name: APK imzasını doğrula
        run: |
          set -euo pipefail

          "$APKSIGNER_PATH" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/OTA-Deneyi-signed.apk

        env:
          APKSIGNER_PATH: ${{ steps.apksigner.outputs.path }}

      - name: SHA-256 hesapla
        run: |
          set -euo pipefail

          sha256sum \
            app/build/outputs/apk/debug/OTA-Deneyi-signed.apk \
            | tee app/build/outputs/apk/debug/OTA-Deneyi-signed.apk.sha256

      - name: İmzalı APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ota-deneyi-signed-apk
          path: |
            app/build/outputs/apk/debug/OTA-Deneyi-signed.apk
            app/build/outputs/apk/debug/OTA-Deneyi-signed.apk.sha256
          if-no-files-found: error

      - name: Keystore dosyasını temizle
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ota-release.jks"
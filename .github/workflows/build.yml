name: Build, Sign and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle izinlerini ayarla
        run: chmod +x ./gradlew

      - name: Debug APK oluştur
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Private key'i kaydet
        run: |
          cat > /tmp/private_key.pem << 'KEYEOF'
          ${{ secrets._PRIVATEKEY_ }}
          KEYEOF

      - name: APK'yı imzala
        run: |
          openssl dgst -sha256 -sign /tmp/private_key.pem \
            -out /tmp/signature.sig \
            app/build/outputs/apk/debug/app-debug.apk
          
          base64 -w0 /tmp/signature.sig > signature.b64
          cp app/build/outputs/apk/debug/app-debug.apk OTA-Deneyi-v6.apk

      - name: Release oluştur ve yükle
        uses: softprops/action-gh-release@v1
        with:
          tag_name: OTA-Deneyi-Realses
          generate_release_notes: true
          files: |
            OTA-Deneyi-v6.apk
            signature.b64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Temizle
        if: always()
        run: rm -f /tmp/private_key.pem /tmp/signature.sig

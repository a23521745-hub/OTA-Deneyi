name: Build, Sign and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: OTA-Deneyi.apk
  APP_DIR: app

jobs:
  build-sign-release:
    name: Build, Sign & Release
    runs-on: ubuntu-latest
    environment: release

    outputs:
      version_code: ${{ steps.version.outputs.next }}
      release_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 📥 Checkout kodu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 versionCode'u oku ve artır
        id: version
        run: |
          CURRENT=$(grep -oP 'versionCode\s+\K[0-9]+' ${{ env.APP_DIR }}/build.gradle)
          NEXT=$((CURRENT + 1))
          TAG="OTA-Deneyi-v${NEXT}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "✓ versionCode: $CURRENT → $NEXT, Tag: $TAG"

      - name: 🔄 versionCode'u güncelle
        run: |
          sed -i "s/versionCode ${{ steps.version.outputs.current }}/versionCode ${{ steps.version.outputs.next }}/" ${{ env.APP_DIR }}/build.gradle
          grep -n "versionCode" ${{ env.APP_DIR }}/build.gradle

      - name: ☕ JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 🔨 Gradle izinlerini ayarla
        run: chmod +x ./gradlew && ./gradlew --version

      - name: 🏗️ Release APK derle
        run: |
          ./gradlew clean assembleRelease \
            --stacktrace \
            --no-daemon
          echo "✓ Build başarılı"

      - name: 📦 APK bilgilerini al
        id: apk_info
        run: |
          SRC_APK=$(find ${{ env.APP_DIR }}/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          if [ ! -f "$SRC_APK" ]; then
            echo "❌ APK dosyası bulunamadı!"
            find ${{ env.APP_DIR }}/build/outputs -type f -name '*.apk'
            exit 1
          fi
          SIZE=$(du -h "$SRC_APK" | cut -f1)
          cp "$SRC_APK" "$APK_NAME"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "✓ APK bulundu: $SRC_APK ($SIZE)"

      - name: 🔐 Private Key ile İmzala + Public Key çıkar
        id: sign
        env:
          PRIVATE_KEY: ${{ secrets._PRIVATEKEY_ }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/private_key.pem"
          echo "$PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Key'i doğrula
          openssl pkey -in "$KEY_FILE" -text -noout > /dev/null
          echo "✓ Private key doğrulandı"

          # RSA-4096 SHA256 ile imzala
          openssl dgst -sha256 -sign "$KEY_FILE" -out signature.sig "$APK_NAME"
          
          # Public key'i çıkar - cihaz doğrulaması için lazım
          openssl pkey -in "$KEY_FILE" -pubout -out public_key.pem

          # Base64 encode
          base64 -w0 signature.sig > signature.b64
          
          echo "✓ İmza ve Public Key oluşturuldu"
          ls -lh signature.b64 public_key.pem "$APK_NAME"
          rm -f "$KEY_FILE" signature.sig

      - name: 📄 update.json oluştur
        id: manifest
        run: |
          SIGNATURE=$(cat signature.b64)
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          cat > update.json << JSONEOF
          {
            "versionCode": ${{ steps.version.outputs.next }},
            "versionName": "v${{ steps.version.outputs.next }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ env.APK_NAME }}",
            "signature": "${SIGNATURE}",
            "publicKeyUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/public_key.pem",
            "changelog": "Otomatik build #${{ github.run_number }} - Secure OTA v${{ steps.version.outputs.next }}",
            "releaseDate": "${TIMESTAMP}",
            "size": "${{ steps.apk_info.outputs.size }}"
          }
          JSONEOF

          echo "✓ update.json oluşturuldu:"
          cat update.json

      - name: 🚀 Release oluştur/güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "OTA-Deneyi v${{ steps.version.outputs.next }}"
          body: |
            **Secure OTA Otomatik Release**
            - **Versiyon:** ${{ steps.version.outputs.next }}
            - **Build ID:** ${{ github.run_number }}
            - **APK Boyutu:** ${{ steps.apk_info.outputs.size }}
            - **İmza Algoritması:** RSA-4096 SHA256
          make_latest: true
          draft: false
          prerelease: false
          files: |
            ${{ env.APK_NAME }}
            signature.b64
            public_key.pem
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Değişiklikleri repo'ya commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.APP_DIR }}/build.gradle update.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${{ steps.version.outputs.next }} - otomatik build #${{ github.run_number }}"
            git push origin main
          fi

      - name: ✅ Build Özeti
        run: |
          echo "════════════"
          echo "✓ Build Başarılı"
          echo "════════════"
          echo "Versiyon: ${{ steps.version.outputs.next }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "APK: ${{ env.APK_NAME }}"
          echo "Boyut: ${{ steps.apk_info.outputs.size }}"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          echo "════════════════════════════════════"